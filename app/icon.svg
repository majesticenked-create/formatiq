<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="6" fill="#0e1116" />
  <!--
    Brackets are hand-drawn paths, not text, so centering doesn't depend on
    font metrics (which vary by browser/OS and can't be trusted to render
    "{ }" symmetrically at favicon sizes). Each brace is defined in local
    coordinates centered at its own origin (spine at local x=0, tip at
    local x=-5, vertical span -9..9, i.e. already symmetric top/bottom).
    The right brace is an exact mirror of the left via scale(-1,1), so the
    pair is symmetric by construction rather than by eyeballing.
  -->
  <path
    d="M 0 -9 C -3 -9 -3 -6 -3 -3 C -3 -1 -4 -1 -5 0 C -4 1 -3 1 -3 3 C -3 6 -3 9 0 9"
    transform="translate(11 16)"
    fill="none"
    stroke="#f2b705"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 0 -9 C -3 -9 -3 -6 -3 -3 C -3 -1 -4 -1 -5 0 C -4 1 -3 1 -3 3 C -3 6 -3 9 0 9"
    transform="translate(21 16) scale(-1 1)"
    fill="none"
    stroke="#f2b705"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
